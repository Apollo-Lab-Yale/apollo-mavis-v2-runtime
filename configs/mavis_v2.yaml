# MAVIS v2 lab cell in simulation (scene apollo-mavis-v2-sim scenes/mavis_v2.yaml).
# Run: uv run python -m apollo_mavis_v2_runtime --config configs/mavis_v2.yaml
host: 127.0.0.1
port: 8765
ui_dist: null              # path to built SPA; null = API-only (Vite dev proxy)
workcells:
  sim:
    kind: sim
    sim_scene: mavis_v2     # POST /api/session may override
    arms:
      - id: view            # Perception Arm (camera-only: wrist RealSense + microphone), outer rail
        base_in_world: {}   # sim arm placement comes from the scene descriptor
        gripper: none
      - id: grip            # Manipulation Arm (xArm gripper + wrist camera), inner rail; default teleop arm
        base_in_world: {}
    cameras: []
    safety:
      safety_debug: false   # true = full hardware safety stack vs the sim cell
  # Real cell (phase-11): lets the Welcome page's Hardware tab open with no arm
  # connected. Exactly TWO control boxes (2026-09-04): Manipulation Arm `grip`
  # at 192.168.1.201 and Perception Arm `view` at 192.168.2.219, one NIC each.
  # An unplugged camera reports `live: false` (pure-black tile) -- no other
  # side effect; a box that is off shows `reachable: unreachable`. Sessions on this
  # workcell (phase-09c/09d, teleop only): POST /api/session kind=hardware brings up
  # BOTH arms (SessionSpec.arms must list every arm below, phase-09d) at
  # `speed_scale` (default 100 % since 2026-09-08 evening; 50 % was the 2026-09-07
  # call), adopts the preview cameras (no UVC re-open) and
  # gates every command through a fresh mavis_v2 twin; it is refused (409) while an
  # arm's rail is unhomed, its controller has an error latched, the read-only
  # monitor has no sample of it, or a rail homing is in progress. Only the
  # rail-homing maintenance motion (home_rail with a planned pre-positioning path)
  # connects ONE arm; the other is then frozen in the gate twin at its last monitor
  # sample (09c D1) and must not be moved from xArm Studio meanwhile.
  # Read-only facts measured on the live cell 2026-09-04 (phase-09a): firmware
  # v1.12.10 on both boxes, SDK 1.18.5; both arms state 4 (not enabled), mode 0.
  # The Perception Arm (view) keeps reporting controller error C19 (end-effector
  # bus; the SDK's title -- what telemetry.hardware_monitor `detail` shows -- is
  # "End Effector Communication Error", xArm Studio calls it "End Module
  # Communication Error") -- the arm card shows it as a red C19 chip. Cause: the
  # box looks for an end effector on the tool RS-485 bus and the Perception Arm
  # has none (get_tgpio_modbus_baudrate -> (1, -1)); one-off fix in xArm Studio:
  # Settings -> Externals -> End Effector -> None (SDK 1.18.5 has no write API for
  # it). Until then the Hardware tab's "Clear errors" (POST .../maintenance
  # clear_errors = clean_error + clean_warn, NO enable) clears it; measured
  # 2026-09-04: clearing moves no joint (<= 5e-5 rad). Both
  # linear tracks are NOT homed and NOT enabled (registers pos 0,
  # on_zero 0, is_enabled 0), so their position register is meaningless: the
  # monitor reports rail_pos_m null and the twin overlay falls back to
  # twin_overlay.rail_fallback_m (grip 0.65 = operator's right end, view 0.0).
  # Homing (set_linear_track_back_origin) IS motion: it is the ONE motion-class
  # maintenance op, `home_rail` (phase-09c) -- operator-triggered from the arm card
  # (Home rail), gated by a full-travel twin sweep at the arm's current posture
  # (hardware_session.home_rail_* below; dry_run shows the verdict first), executed
  # on the read-only monitor's thread with zero writes when the sweep is clear.
  # A posture that is NOT sweep-clear (phase-09d) gets a twin-planned pre-positioning
  # path to the arm's keyframe / home posture, checked for EVERY rail position; the
  # operator confirms, the runtime connects that arm alone (rail unhomed, 10 %),
  # drives the path under the gate, homes the rail, holds the posture (202 + job
  # progress on telemetry, result at GET .../maintenance/last).
  # The driver never homes at connect (RailNotHomedError -> session 409).
  # Controller-side backstops (phase-09b; 02-hardware §6): tcp_load_kg /
  # tcp_load_cog_mm / collision_sensitivity are written by the driver at every
  # connect and by the Hardware tab's "Apply safety settings" (POST .../maintenance
  # apply_backstops) with no session; the read-only monitor reads them back
  # (telemetry hardware_monitor.arms[*].collision_sensitivity / tcp_load_kg /
  # tcp_load_cog_mm, backstops_match = equal sensitivity, |d load| <= 0.05 kg,
  # |d cog| <= 10 mm). As found 2026-09-04 both boxes had tcp_load 0 kg (wrong:
  # collision detection is torque-estimate based) and sensitivity 3 (grip) / 1
  # (view). The values are volatile (lost at a controller reboot).
  hardware:
    kind: hardware
    digital_twin_scene: mavis_v2   # same cell as the sim scene; the Perception Arm carries the microphone body
    arms:
      - id: grip                  # Manipulation Arm: xArm Gripper G2 + wrist camera (inner rail); default teleop arm
        ip: 192.168.1.201         # control box 1
        base_in_world: {}         # rail origin in world; measured in phase-09 (03-sim §4.3)
        gripper: xarm_g2          # force-capable Gripper G2 (ArmStatusInfo.gripper_force_capable)
        tcp_load_kg: 0.95         # estimate accepted by the user 2026-09-05 (not weighed): Gripper G2 + D435i + mount
        tcp_load_cog_mm: [0, 0, 60]   # estimate (not measured): payload centre of gravity, flange frame, mm
        collision_sensitivity: 3  # 0 = off .. 5 = most sensitive; lab decision: 3 on both arms
      - id: view                  # Perception Arm: wrist RealSense D435 + RØDE NT-USB Mini (outer rail, nearest the operator)
        ip: 192.168.2.219         # control box 2
        base_in_world: {}
        gripper: none
        microphone: true          # RØDE NT-USB Mini ahead of the wrist camera -> twin collision body
        tcp_load_kg: 0.55         # estimate accepted by the user 2026-09-05 (not weighed): D435i 0.072 + NT-USB Mini ~0.35 + mount
        tcp_load_cog_mm: [0, 0, 90]   # estimate (not measured): the mic sits ahead of the camera
        collision_sensitivity: 3  # the box was found at 1 (too low) on 2026-09-04
    # Both wrist cameras are Intel RealSense D435i used as plain UVC colour
    # cameras (kind v4l2, no depth): addressed by USB serial (sysfs lookup)
    # because the /dev/v4l/by-id symlinks collide between the depth and colour
    # interfaces, and the colour stream is YUYV only (fourcc). Serial -> arm
    # mapping CONFIRMED by the user on 2026-09-04 from the Hardware-tab tiles.
    # intrinsics = the D435i COLOUR imager at 640x480 (`rs-enumerate-devices -c`,
    # Inverse Brown-Conrady, distortion ignored; fovy = 2*atan(240/fy) ~ 43.2 deg,
    # NOT the MJCF fovy 57 which is the depth field of view). The twin overlay
    # (`<id>_align` streams) renders the digital twin with exactly these values.
    cameras:
      - id: grip_wrist               # Manipulation Arm wrist (USB serial 349643062582 -> RS ASIC 327122074467)
        kind: v4l2
        serial: "349643062582"
        fourcc: YUYV
        resolution: [640, 480]
        fps: 30
        intrinsics: {fx: 608.19, fy: 608.23, cx: 327.39, cy: 247.90}
      - id: view_wrist               # Perception Arm wrist (USB serial 322143060792 -> RS ASIC 243522071002)
        kind: v4l2
        serial: "322143060792"
        fourcc: YUYV
        resolution: [640, 480]
        fps: 30
        intrinsics: {fx: 606.36, fy: 606.38, cx: 311.90, cy: 249.45}
    safety:
      enabled: true               # hardware refuses to start without the safety gate
# Data + calibration live inside the workspace (${APOLLO_HOME} = ws root, resolved by
# config.py: $APOLLO_HOME if the launcher/systemd export it, else inferred from this
# file's location). A fresh clone runs with everything under <ws>/var and no ~/apollo.
profiles_dir: ${APOLLO_HOME}/var/profiles
datasets_root: ${APOLLO_HOME}/var/datasets        # GENERIC dataset root: <root>/<ns>/<name> for every namespace not mapped below (the phase-07..13 apollo/... data stays listable)
# Per-namespace dataset roots (operator decision 2026-09-08; 15-online-dagger §7 / D5). Repo ids keep
# the <ns>/<name> grammar; only WHERE a namespace lives changes. A bare `dataset: "<name>"` in a
# collect launch resolves into default_namespace. Roots expand ~ / ${APOLLO_HOME} like datasets_root.
datasets:
  default_namespace: bc_demo                      # Data Collection records demonstrations as bc_demo/<name>
  namespaces:
    bc_demo:    {root: ~/data/bc_demo}                       # -> ~/data/bc_demo/<name>
    online_dagger: {root: ~/data/online_dagger, subdir: rollouts}  # -> ~/data/online_dagger/<session>/rollouts (next to session.json; the trainer's own files live beside them)
checkpoints_root: ${APOLLO_HOME}/var/checkpoints
# Online DAgger (phase-14; 15-online-dagger §7): the runtime's side only - it is the
# algorithm-agnostic shell, the trainer node configures itself. skill_dir null = the skill
# shipped inside the package (GET /api/online_dagger/skill[.tgz]); session_file_hz caps
# session.json rewrites outside transitions. Same values as the model defaults.
online_dagger:
  skill_dir: null
  session_file_hz: 1.0
calibration_dir: ${APOLLO_HOME}/var/calibration   # tracker_calibration.json (applied yaw, base-station install) + libsurvive config copies (phase-10 wizard)
control:
  rate_hz: 100
  teleop: {linear_mps: 0.12, angular_rps: 0.6, rail_mps: 0.10, gripper_frac_ps: 1.2}
  # Frame the keyboard TRANSLATE keys (W/S/A/D/E/Q) act in (04-runtime §6). world = the
  # DEFAULT (operator decision 2026-09-08 evening; camera was that morning's default): the
  # operator frame, fixed to the table - W away from the operator (-Y), A to their left (+X),
  # E up. camera = the ACTIVE arm's wrist camera - W along the optical axis, A/D image
  # left/right, E/Q image up/down, so the keys keep matching the wrist stream after any
  # rotation (E/Q are then image up/down, not world up/down). base = the pre-2026-09-08
  # arm-base axes, which in this cell read yawed 180 deg against the operator's view.
  # Rotations (I/K/J/L/U/O) are about the TCP axes in every setting; the policy action
  # frame (arm_base:<id>) is unaffected.
  translate_frame: world
  leash: {pos_m: 0.025, rot_rad: 0.2}
  target_rate: {v_mps: 1.0, w_radps: 2.0}   # tracker target rate limit toward the hand, m/s and rad/s (> 0; per-tick cap = rate*dt; 04-runtime §6)
  dq_max_rad: 0.04
  jog: {slew_rad_per_tick: 0.02, rail_m_per_tick: 0.002}   # joint panel: constant-speed approach, any delta
  watchdog: {stale_s: 0.2, ramp_s: 0.1}
  health_log_every_s: 1.0   # control-loop INFO health line period (tick rate, clutch, tracker ages, gate, IK slips, servo stats); 0 = off
telemetry_hz: 25
video: {preview_fps: 15, session_fps: 30, jpeg_quality: 80}
egl_device_id: 0
# Process log (2026-09-07): a rotating file the runtime writes itself, next to the rest of
# the machine state under ${APOLLO_HOME}/var (gitignored); stderr keeps the same lines for
# journald / the dev launcher's raw capture (var/logs/runtime.stderr.log, which is ALSO where
# libsurvive's C-side prints land - they never pass through Python logging). level DEBUG adds
# per-event IK slips and driver events; access_log re-enables uvicorn's per-request lines.
logging:
  level: INFO                      # DEBUG | INFO | WARNING | ERROR (both handlers)
  dir: ${APOLLO_HOME}/var/logs     # null = stderr only
  file: runtime.log
  max_bytes: 20971520              # 20 MB per file ...
  backup_count: 10                 # ... x 10 kept (runtime.log.1 .. .10)
  access_log: false
# Perception Arm (`view`) microphone preview (phase-11; 04-runtime §13.3/§14). Captured THROUGH
# PulseAudio only (the daemon owns the RØDE NT-USB Mini; a direct hw: open fails
# with EBUSY and stalls every other Pulse client). backend: auto = sounddevice
# (PortAudio ALSA `pulse` plugin, PULSE_SOURCE pinned) -> parec subprocess;
# fake = synthetic AM sine (tests); none = listed but not captured. Frame rate
# follows telemetry_hz (25 Hz -> 1920 samples = 64 bins x 30). Absent device ->
# status absent, live false (the Hardware tab still opens).
microphone:
  enabled: true
  mic_id: mic_view
  label: Perception Arm microphone   # user-facing (landing page, telemetry); the device itself is picked by source_match
  backend: auto                 # auto | sounddevice | parec | fake | none
  source_match: NT-USB Mini     # substring of the Pulse source name/description (pactl list sources)
  sample_rate: 48000            # the NT-USB Mini is 48 kHz mono only
  bins: 64                      # int8 min/max envelope points per frame
  stale_s: 0.5                  # no frame for this long -> stalled
# Hardware reachability probe (phase-11): TCP connect-and-close on <arm ip>:port
# every period_s (never writes; paused while a hardware session runs) ->
# ArmStatusInfo.reachable and WorkcellStatus.hardware_ready.
hardware_probe:
  enabled: true
  period_s: 2.0
  timeout_s: 1.0
  port: 502                     # xArm control port; 30001-30003 report streams are never probed
# Read-only controller state monitor (phase-09a; 04-runtime §13.3 telemetry
# `hardware_monitor`): one read-only SDK client per hardware arm polls joint
# angles, flange pose, error/warn codes, linear-track and gripper registers --
# never a motion / mode / state / clean_* command -- so the Welcome page shows
# the real error codes (Perception Arm C19) and the twin overlay can pose the
# digital twin without a session. PAUSED (connections released) while a
# hardware session owns the boxes: two SDK clients on one control box are
# unevidenced. Without the [hardware] extra: enabled false, status off.
hardware_monitor:
  enabled: true
  poll_hz: 10.0                 # joints / pose / codes; rail + gripper registers at ~2 Hz
  stale_s: 0.5                  # no sample for this long -> stale (grey twin)
  reconnect_s: 2.0              # first retry delay after a connect / read failure (doubles to 10 s)
# Digital-twin alignment overlays (phase-09a; 04-runtime §13.4): streams
# grip_wrist_align / view_wrist_align = the real wrist-camera frame + the
# mavis_v2 twin (Perception Arm with the microphone body) posed from the
# monitor's joint angles and rendered from the same wrist camera with the
# D435i colour intrinsics above, composited as a pale-yellow translucent
# silhouette; table / obstacle edges in blue as the base-placement cue. Kind
# `twin` in /api/cameras; live iff the real camera is live and the monitor
# delivers samples. NOT a calibration: a visual alignment tool for the twin's
# rail position / direction, base pose, camera extrinsics and joint convention.
twin_overlay:
  enabled: true
  fps: 12.0
  alpha: 0.5                    # robot tint opacity
  tint_rgb: [255, 235, 140]     # pale yellow, shaded by the twin's own luminance
  edge_rgb: [255, 220, 60]      # 1 px robot outline
  env_outline: true             # table / obstacle edges as thin lines
  env_rgb: [90, 200, 250]
  stale_tint_rgb: [170, 170, 170]   # monitor stale / error -> grey twin
  joint1_offset_rad: 0.0        # diagnostic knob only: the identity joint convention is verified (2026-09-04)
  # rail_flip moved to hardware_session.rail_flip (phase-09c; the old key is still
  # accepted as an alias for one release and unified with the new one).
  rail_fallback_m: {grip: 0.65, view: 0.0}  # assumed rail position while the track is not homed (see the hardware workcell header); also the home_rail sweep's / frozen arm's assumption
  # Per-camera OVERLAY-ONLY principal-point nudge {camera_id: [du, dv]} (cx += du, cy += dv);
  # aligns a wrist camera whose real mount differs slightly from the shared xarm7_on_rail.xml
  # `wrist_cam` pose (solved on the Manipulation Arm) WITHOUT touching the true factory
  # intrinsics above (those get baked into recordings). Measured 2026-09-06 (03-sim §4.3 "per-arm
  # wrist camera overlay offset"): the Perception Arm's overlay was a uniform ~2 cm (21 px x,
  # 13 px y) image shift across all links at all depths -> a fixed view-camera mount offset, not
  # parallax; the Manipulation Arm needed 0. A principal-point offset cancels a uniform, pose-
  # independent shift exactly (residual < 1 px after the fix).
  principal_offset_px: {view_wrist: [21.0, 13.0]}
  stream_suffix: _align
  # phase-15 (16-gello D6): the twin scene the *_align overlays render. null = the hardware
  # workcell's digital_twin_scene (mavis_v2); the lab render may set mavis_v2_kitchen
  # (TWIN_OVERLAY_SCENE) so the appliance outlines can be aligned against the real cameras.
  scene: null
# Real-cell sessions (phase-09c/09d; 04-runtime §5/§14). default_speed_scale is what
# the Hardware tab pre-selects - 1.0 since the evening of 2026-09-08 (operator decision
# after a day of live sessions; 0.5 was the 2026-09-07 call, the 10 % default was for the
# first live runs only; segments 10/50/100 %); SessionSpec.speed_scale decides; the UI's
# DEFAULT_SPEED_SCALE mirrors it. plan_gate_hold_s (2026-09-08 evening): a twin-planned
# motion the safety gate holds for longer than this with no waypoint progress is cancelled
# by the loop at once, naming the blocking pair ("held by the safety gate: <a> / <b> at
# <mm> mm") instead of sitting still until the 30 s return budget - on 2026-09-08 a
# reset_to_initial executed both arms' sequentially planned paths at the same time and
# sat gate-blocked at 5.2 mm; plans now execute ONE ARM AT A TIME in the planner's
# arm_order (04-runtime §10.5). Since phase-09d a hardware session always includes BOTH arms
# (SessionSpec.arms must equal the arms above, else 409) - the phase-09c
# default_arms key is gone. rail_flip maps the track register onto the twin's rail
# slot as q_sim = 0.65 - q_track for the overlay AND the gate / sweep twins -- home
# the rail, look at the *_align overlay: if the twin's carriage sits at the wrong
# end, set true and restart. home_rail_inflation_m / home_rail_step_m tune the twin
# sweep that gates the home_rail op (D4: 25 mm blind-sweep margin, 5 mm steps = 131
# checks over 0.65 m) and the position-agnostic check of its planned
# pre-positioning path; bringup_timeout_s bounds bring_up in POST and in the job.
hardware_session:
  armed: false                # arming switch: real drivers connect / rails home ONLY when true.
                              # Repo default false (tests, dev instances); the lab render sets true.
  default_speed_scale: 1.0    # 100 % (2026-09-08 evening); 50 % was the 2026-09-07 call
  plan_gate_hold_s: 3.0       # gate-held abort of a running plan (s); 0 = the first held tick
  rail_flip: false
  home_rail_inflation_m: 0.025
  home_rail_step_m: 0.005
  bringup_timeout_s: 60.0
tracker:
  # Vive-tracker teleop (13-tracker §4). backend: none | fake | libsurvive.
  # `fake` = scripted 0.15 m circle at 100 Hz so the UI/pipeline can be
  # exercised without hardware (hold KeyC / gamepad RT to clutch).
  # For the real tracker: run scripts/tracker/01-sudo-udev-and-deps.sh and
  # 02-build-pysurvive.sh once, keep the tracker still with both base
  # stations visible on first start (~10-20 s), then set `backend: libsurvive`.
  # The LIVE config (~/apollo/mavis_v2_live.yaml, rendered by the operations
  # deployment) runs the real cell with `backend: libsurvive`; this shipped
  # file keeps `fake` so the stack runs without the Vive hardware.
  backend: fake
  object_name: WM0                            # dongle-paired tracker codename
  libsurvive_args: ["--lighthousecount", "4", "--globalscenesolver", "0", "--disable-calibrate", "1"]  # freeze the lighthouse calibration during teleop (2026-09-03: the online scene solver moved a station 32 cm mid-session)
  libsurvive_config_path: ${APOLLO_HOME}/var/libsurvive/config.json  # libsurvive reads/writes this at teleop (tracker.py passes --configfile); replaced ONLY by the base-station wizard's install step (backup .bak-<ts> next to it)
  yaw_deg: 0.0                                # lighthouse -> MJCF world yaw; first-start default only: a yaw applied by the wizard (calibration_dir/tracker_calibration.json, yaw_valid) overrides it
  pos_scale: 1.0                              # tracker -> EE displacement gain (0.1-3)
  follow_rotation: true                       # apply tracker orientation deltas
  stale_s: 0.2                                # sample age above this -> hold
  max_jump_m: 0.10                            # consecutive-sample jump -> invalid
  # Vive-controller buttons (13-tracker §1.1). Each action is bound to one
  # input: trigger_click | trackpad_left | trackpad_right | trackpad_up |
  # trackpad_down | menu_click | grip_click | none; an input may serve one
  # action only. A trackpad click is classified ONCE at its press edge from the
  # pad position (dominant axis; |x| and |y| both within trackpad_deadzone ->
  # ignored) and held until release. Held actions inject the keymap codes of
  # tracker_clutch (KeyC), gripper_open (KeyH), gripper_close (KeyF), rail_neg
  # (ArrowLeft) and rail_pos (ArrowRight) while the input is active; they merge
  # into the tick's held set while the controller's sample stream is fresh
  # (<= stale_s) and are NOT covered by the WebSocket deadman: the rail codes DO
  # drive the rail, at the device source's scale (1.0 fresh / 0.0 stale), with
  # or without a browser connected. Discrete actions (arm_next -> switch_arm,
  # arm_prev -> switch_arm_prev) fire once per press edge of their input inside
  # the control loop with the same nacks as the WS actions (e.g. takeover
  # engaged) and show up as telemetry tracker.device_action for ~1 s; they
  # accept any input except trigger_click (held-only). The system button is not
  # bindable (menu+system = dongle pairing combo). The `fake` backend has no
  # buttons; unit/e2e tests script a controller state.
  # THE OPERATOR'S MAPPING - do not change it without being asked (2026-09-07: it
  # was briefly remapped to work around the trackpad's stale-axes bug and that was
  # the wrong call; the bug itself is fixed in the reader's late classification,
  # devices/tracker.py note_edges, so the pad is reliable again).
  controller_map:
    clutch: trigger_click                     # trigger button (id 0) pressed (held)
    gripper_open: trackpad_up                 # trackpad click, y dominant and positive (held, rate)
    gripper_close: trackpad_down              # trackpad click, y dominant and negative (held, rate)
    rail_neg: trackpad_left                   # trackpad click, x dominant and negative (held)
    rail_pos: trackpad_right                  # trackpad click, x dominant and positive (held)
    arm_next: menu_click                      # menu button (id 6) press edge (discrete)
    arm_prev: none                            # keyboard KeyZ / gamepad LB only
  trackpad_deadzone: 0.3                      # |x| and |y| both within this -> click ignored
  # One Euro pose filter on the aligned tracker pose, run in the provider at the
  # 100 Hz tick before the anchor/delta math (13-tracker §4 "Pose filter"):
  # strong smoothing at rest (min_cutoff_hz), cutoff rising with speed (beta),
  # then a rest deadband so a resting hand commands exactly zero motion. Resets
  # on clutch engage and after stale/invalid gaps. enabled / min_cutoff_hz /
  # beta are live-tunable via the tracker_settings action (filter_* fields);
  # telemetry echoes them and reports tracker.pose_filtered.
  # RETUNED 2026-09-07 after measuring this filter as the OTHER half of the teleop lag
  # (the first half was the host chain outrunning the servo streamer, see apply_teleop_caps):
  # beta is Hz per (m/s), so the old 0.05 added 0.015 Hz at a 0.3 m/s hand, the cutoff never
  # left 1.0 Hz, and it was a FIXED 159 ms low-pass = 39 mm behind at 0.3 m/s, past the 25 mm
  # leash, so the leash truncated every tick and slip() discarded real hand travel. beta 5.0
  # is 7.6 mm / ~25 ms there and still passes the >= 4x rest-jitter contract; d_cutoff_hz
  # stays 1.0 on purpose (raising it buys ~8 ms and costs a third of the jitter rejection —
  # the wrong trade while libsurvive keeps corrupting the lighthouse calibration).
  # control/pose_filter.py has the numbers and the two experiments to re-run.
  filter:
    enabled: true
    min_cutoff_hz: 1.0                        # 0.05-50; lower = smoother at rest, more lag
    beta: 5.0                                 # 0-200, Hz per (m/s); higher = less lag when moving
    d_cutoff_hz: 1.0                          # velocity-estimate cutoff; raising it couples noise in
    deadband_m: 0.001                         # rest deadband, position (m)
    deadband_rad: 0.005                       # rest deadband, orientation (rad)
  # Calibration wizard (Devices page; 13-tracker §4 "Calibration modes"). Base
  # station: capture >= min_scenes GSS scenes (controller parked still >= 3 s per
  # spot) on a temporary config copy, validate with the frozen solution and the
  # moving-mode sensor window (2026-09-03 acceptance: std < 5 mm, max step < 20 mm),
  # install. Yaw: 7-click gesture (start, left, forward, right, back, up, down).
  calibration:
    min_scenes: 6
    validation_seconds: 10.0                  # still-controller window measured
    validation_skip_seconds: 3.0              # convergence window dropped first
    validation_std_mm: 5.0                    # per-axis position std threshold
    validation_step_mm: 20.0                  # adjacent-sample max step threshold
    still_window_s: 0.5                       # controller_still indicator window
    still_threshold_mm: 3.0                   # ... position std below this = still
    yaw_min_leg_m: 0.10                       # each horizontal gesture leg at least this long
    yaw_max_residual_deg: 15.0                # mean leg misalignment after the fit
    yaw_capture_average_s: 0.3                # a click averages the raw positions of this window
# GELLO leader arm (phase-15; 16-gello §4 / §9.1). The passive xArm7-shaped leader whose
# Dynamixel servos are read over one USB serial adapter (FTDI FT232H 0403:6014,
# /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FTAKROCJ-if00-port0 on the lab
# machine) and drive the Manipulation Arm in joint space in the `gello` session mode.
# backend: none | fake | dynamixel - this shipped file keeps `none` (GET /api/gello says
# no_backend); the lab render sets `dynamixel` (GELLO_BACKEND / GELLO_USB_SERIAL / GELLO_BAUD)
# and needs the runtime's [gello] extra (dynamixel-sdk + pyserial, imported only in
# devices/gello.py). `fake` publishes a scripted posture (the mavis_v2 keyframe of the
# Manipulation Arm, gripper open) at poll_hz so a sim GELLO session launches already synced;
# tests move it with GelloReader.fake_set. The reader never enables torque or writes a goal.
gello:
  backend: none
  port: /dev/ttyUSB0            # serial node (a /dev/serial/by-id symlink is fine)
  usb_serial: null              # e.g. FTAKROCJ -> the ttyUSB node whose sysfs USB parent has that serial wins
  baud: null                    # null = scan 57600 / 1M / 2M / 3M / 4M with a broadcast ping per rate
  joint_ids: [1, 2, 3, 4, 5, 6, 7]
  gripper_id: 8                 # null = no gripper channel
  joint_signs: [1, 1, 1, 1, 1, 1, 1]        # OPERATOR-OWNED once set (one manual check per joint)
  joint_offsets_rad: null       # null = var/gello_calibration.json (POST /api/gello/calibrate match_arm)
  poll_hz: 100.0
  stale_s: 0.2                  # sample older than this -> no_leader (hold)
  max_jump_rad: 0.5             # consecutive raw jump above this -> invalid sample (never a target)
  engage_tol_rad: 0.10          # leader within this of the measured arm -> tracking
  leash_rad: 0.80               # leader farther than this from the command while tracking -> out_of_sync
  gripper_quantum: 0.01
  max_joint_vel_rad_s: 0.6      # the follower's per-joint cap in SIM too (hardware has it in ServoLimits)
  view_posture_rad: [2.646, -1.598, 0.018, 1.637, 0.25, 2.007, 0.029]   # Perception Arm GELLO hold posture (J1-J7)
  view_rail_m: 0.0              # ... and its rail slot (twin convention)
  scene_id: mavis_v2_kitchen    # the twin the GELLO card launches (sim and hardware; hidden from GET /api/scenes)
  calibration_path: ${APOLLO_HOME}/var/gello_calibration.json
# External interface over dora-rs 1.0 (phase-12; docs/design/14-dora-interface.md). OFF in the
# tracked config: with `enabled: false` the runtime is byte-for-byte the phase-11 runtime. When
# on, the runtime owns a PRIVATE coordinator + daemon on the ports below (never the machine-
# global 6013 / 53291), attaches as the dynamic node `mavis_runtime` and publishes, for the
# whole process lifetime, both wrist cameras (+ the Perception Arm's depth sibling when a
# producer has depth) with the camera pose stamped on every frame, both arms' states (from the
# read-only monitor between sessions), the microphone, telemetry, the `session` contract
# message and `events`; the ONLY inbound command family is the external policy's
# (`policy_action`, sessions with `policy_source: external`). Nothing on the bus can move an
# arm outside a session. bind_host: 127.0.0.1 = same-host consumers only; the lab render
# (DORA_BIND_HOST=wlp38s0 -> the APOLLO Lab Wi-Fi, 192.168.0.88 on 2026-09-07, DHCP) binds the
# LAN so machines listed under `machines` can join with their own `dora daemon --machine-id`;
# 0.0.0.0 and the arm-link addresses 192.168.1.11 / 192.168.2.12 are refused. Consumers read
# the connection facts from GET /api/dora (`python -m apollo_mavis_v2_runtime.dora_bridge.nodes.env`).
dora:
  enabled: false
  node_id: mavis_runtime
  dataflow_name: mavis_v2
  bind_host: 127.0.0.1          # IPv4 or interface name (wlp38s0 / tailscale0), resolved at start
  machine_id: lab
  machines: []                  # e.g. [{id: gpubox, placeholders: [viewer, observer]}]
  rescan_s: 5.0                 # registered-daemon poll (dora doctor): REST-visible only - placeholders
                                # come with POST /api/dora/machines/{id}/join (14-dora §16.1)
  join_attach_timeout_s: 30.0   # the remote consumer must attach within this after its join
  auth: null                    # null = on whenever bind_host is not loopback; token in var_dir/.dora-token
  coordinator_port: 6113
  daemon_port: 53391
  zenoh_port: 7447
  var_dir: ${APOLLO_HOME}/var/dora   # rendered YAML, out/, lock, token, node-stdout.log
  attach_retry_s: [1.0, 10.0]
  bus_poll_s: 0.002
  publish:
    state_hz: 50                # arm_state / arm_cmd while a session runs (<= control.rate_hz)
    idle_state_hz: 10           # arm_state between sessions (read-only source)
    obs_hz: 30                  # obs_state (dagger / inference)
    obs_in_collect: false
    cameras: all                # all | [camera ids]
    depth_cameras: [view_wrist_cam]   # sim depth sibling / hardware depth publish list
    image_pose: true            # q / tcp_pose_world / camera_pose_world / intrinsics on wrist frames
    audio: true
    telemetry: true
    events: true
    idle_source: monitor        # hardware arm states between sessions: monitor (phase-09a read-only
                                #   client, zero extra connections) | driver (own read-only XArmDriver)
  policy:
    spec_stale_s: 3.0           # no policy_spec heartbeat -> policy_attached false -> hold
    max_obs_age_s: 0.5          # actions referencing older observations are dropped
  log:
    quiet_node_diagnostics: true   # fd-1 redirect of dora's stdout JSON WARN flood to var_dir/node-stdout.log

[project]
name = "apollo-xarm7-runtime"
version = "0.1.0"
description = "Session engine, control loop, and server for the apollo-xarm7 stack"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
dependencies = [
    "apollo-xarm7-core",
    "numpy>=1.24,<3",
    "pydantic>=2.5,<3",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "opencv-python>=4.8",
    # LeRobot v3 dataset writer (recorder/ only; lazy-imported — 04-runtime §10).
    # 0.6.x is the pinned minor (v3.0 format); needs Python >=3.12.
    "lerobot[dataset]>=0.6.1,<0.7",
    # AsyncTrainer control channel (12-dagger §7): ZMQ REQ/REP on 127.0.0.1.
    "pyzmq>=25",
]

[project.optional-dependencies]
sim = ["apollo-xarm7-sim"]
hardware = ["apollo-xarm7-hardware"]
trainer = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.uv.sources]
apollo-xarm7-core = { path = "../apollo-xarm7-core", editable = true }
apollo-xarm7-sim = { path = "../apollo-xarm7-sim", editable = true }
apollo-xarm7-hardware = { path = "../apollo-xarm7-hardware", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apollo_xarm7_runtime"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"xarm".msg = "runtime talks to hardware only via apollo_xarm7_hardware"
"torch".msg = "torch is sanctioned only inside apollo_xarm7_runtime.dagger (policy + trainer)"
"lerobot".msg = "lerobot is imported lazily inside apollo_xarm7_runtime.recorder only"
"pysurvive".msg = "pysurvive is imported lazily inside apollo_xarm7_runtime.devices.tracker only"

[tool.ruff.lint.per-file-ignores]
# The recorder package and its tests are the one sanctioned lerobot import site.
"src/apollo_xarm7_runtime/recorder/*" = ["TID251"]
"tests/test_recorder*.py" = ["TID251"]
"tests/test_e2e_collect.py" = ["TID251"]
# The tracker device module is the one sanctioned (lazy) pysurvive import site.
"src/apollo_xarm7_runtime/devices/tracker.py" = ["TID251"]
# The dagger package owns the live Policy object (12-dagger §1) and the
# trainer process; torch (and spool parquet reads) are sanctioned here.
"src/apollo_xarm7_runtime/dagger/*" = ["TID251"]
"src/apollo_xarm7_runtime/dagger/trainer/*" = ["TID251"]
"tests/dagger/*" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "egl: requires a GPU/EGL-capable headless renderer",
    "perf: timing assertions; skip on loaded machines",
]

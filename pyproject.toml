[project]
name = "apollo-mavis-v2-runtime"
version = "0.1.0"
description = "Session engine, control loop, and server for the apollo-mavis-v2 stack"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
dependencies = [
    "apollo-mavis-v2-core",
    "numpy>=1.24,<3",
    "pydantic>=2.5,<3",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "opencv-python>=4.8",
    # LeRobot v3 dataset writer (recorder/ only; lazy-imported — 04-runtime §10).
    # 0.6.x is the pinned minor (v3.0 format); needs Python >=3.12.
    "lerobot[dataset]>=0.6.1,<0.7",
    # AsyncTrainer control channel (12-dagger §7): ZMQ REQ/REP on 127.0.0.1.
    "pyzmq>=25",
]

[project.optional-dependencies]
sim = ["apollo-mavis-v2-sim"]
hardware = ["apollo-mavis-v2-hardware"]
trainer = []
# Microphone preview (phase-11): PortAudio over the ALSA `pulse` plugin; lazy-imported
# in devices/microphone.py only. Needs apt libportaudio2 on the host.
audio = ["sounddevice>=0.5"]
# GELLO leader arm (phase-15; 16-gello D2): Dynamixel protocol 2.0 over the FT232H serial
# adapter; lazy-imported in devices/gello.py only. Without it GET /api/gello says no_backend.
gello = ["dynamixel-sdk>=3.7", "pyserial>=3.5"]
dora = [
    "dora-rs>=1.0.1,<1.1",
    "dora-rs-cli>=1.0.1,<1.1",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.uv.sources]
apollo-mavis-v2-core = { path = "../apollo-mavis-v2-core", editable = true }
apollo-mavis-v2-sim = { path = "../apollo-mavis-v2-sim", editable = true }
apollo-mavis-v2-hardware = { path = "../apollo-mavis-v2-hardware", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apollo_mavis_v2_runtime"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"xarm".msg = "runtime talks to hardware only via apollo_mavis_v2_hardware"
"torch".msg = "torch is sanctioned only inside apollo_mavis_v2_runtime.dagger (policy + trainer)"
"lerobot".msg = "lerobot is imported lazily inside apollo_mavis_v2_runtime.recorder only"
"pysurvive".msg = "pysurvive is imported lazily inside apollo_mavis_v2_runtime.devices.tracker only"
"sounddevice".msg = "sounddevice is imported lazily inside apollo_mavis_v2_runtime.devices.microphone only"
"dynamixel_sdk".msg = "dynamixel_sdk is imported lazily inside apollo_mavis_v2_runtime.devices.gello only (16-gello D2)"
"serial".msg = "pyserial is imported lazily inside apollo_mavis_v2_runtime.devices.gello only (16-gello D2)"
"dora".msg = "dora is imported lazily inside apollo_mavis_v2_runtime.dora_bridge only (14-dora §1)"
"pyarrow".msg = "pyarrow is imported inside apollo_mavis_v2_runtime.dora_bridge, the dagger spool and the recorder (episode frames.parquet) only"

[tool.ruff.lint.per-file-ignores]
# The recorder package and its tests are the one sanctioned lerobot import site.
"src/apollo_mavis_v2_runtime/recorder/*" = ["TID251"]
"tests/test_recorder*.py" = ["TID251"]
"tests/test_e2e_collect.py" = ["TID251"]
"tests/test_export_lerobot.py" = ["TID251"]
"tests/test_episode_dir_recorder.py" = ["TID251"]  # reads the episode frames.parquet (pyarrow)
"tests/test_return_to_start.py" = ["TID251"]
# The tracker device module is the one sanctioned (lazy) pysurvive import site.
"src/apollo_mavis_v2_runtime/devices/tracker.py" = ["TID251"]
# The microphone device module is the one sanctioned (lazy) sounddevice import site.
"src/apollo_mavis_v2_runtime/devices/microphone.py" = ["TID251"]
# The GELLO leader device module is the one sanctioned (lazy) dynamixel_sdk / serial import site.
"src/apollo_mavis_v2_runtime/devices/gello.py" = ["TID251"]
# The dagger package owns the live Policy object (12-dagger §1) and the
# trainer process; torch (and spool parquet reads) are sanctioned here.
"src/apollo_mavis_v2_runtime/dagger/*" = ["TID251"]
"src/apollo_mavis_v2_runtime/dagger/trainer/*" = ["TID251"]
"tests/dagger/*" = ["TID251"]
# phase-12: the dora bridge is the ONE sanctioned dora / pyarrow import site (lazy);
# its helper nodes are separate processes; tests/dora_bridge exercise the real control plane.
"src/apollo_mavis_v2_runtime/dora_bridge/*" = ["TID251"]
"src/apollo_mavis_v2_runtime/dora_bridge/nodes/*" = ["TID251"]
"tests/dora_bridge/*" = ["TID251"]
"examples/*" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "egl: requires a GPU/EGL-capable headless renderer",
    "perf: timing assertions; skip on loaded machines",
    "dora: needs the [dora] extra + CLI; starts a private dora control plane on free ports",
]

[project]
name = "apollo-xarm7-runtime"
version = "0.1.0"
description = "Session engine, control loop, and server for the apollo-xarm7 stack"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
    "apollo-xarm7-core",
    "numpy>=1.24,<3",
    "pydantic>=2.5,<3",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
sim = ["apollo-xarm7-sim"]
hardware = ["apollo-xarm7-hardware"]
trainer = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.uv.sources]
apollo-xarm7-core = { path = "../apollo-xarm7-core", editable = true }
apollo-xarm7-sim = { path = "../apollo-xarm7-sim", editable = true }
apollo-xarm7-hardware = { path = "../apollo-xarm7-hardware", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apollo_xarm7_runtime"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"xarm".msg = "runtime talks to hardware only via apollo_xarm7_hardware"
"torch".msg = "torch belongs to the trainer process (phase-08)"
"lerobot".msg = "lerobot belongs to the recorder (phase-07)"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "egl: requires a GPU/EGL-capable headless renderer",
    "perf: timing assertions; skip on loaded machines",
]

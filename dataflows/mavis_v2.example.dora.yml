# generated by apollo_mavis_v2_runtime.dora_bridge.dataflow - do not edit
# dataflow mavis_v2; local machine lab; mavis_schema 1
nodes:
  - id: mavis_runtime  # the runtime attaches here (Node(node_id)); never spawned
    deploy: {machine: lab}
    path: dynamic
    inputs:
      tick: dora/timer/hz/10
      probe_heartbeat: probe/heartbeat
      policy_action: {source: policy/action, queue_size: 1, queue_policy: drop_oldest}
      policy_spec: {source: policy/spec, queue_size: 1}
      policy_status: {source: policy/status, queue_size: 8}
      policy_trainer_status: {source: policy/trainer_status, queue_size: 8}
    outputs: [heartbeat, session, telemetry, events, arm_state, arm_cmd, obs_state, policy_reset, cam_cam_front, cam_cam_top, cam_view_wrist_cam, cam_view_wrist_cam_depth, cam_grip_wrist_cam, cam_grip_wrist, cam_view_wrist, mic_mic_view]
  - id: policy  # placeholder: the policy repo attaches as Node("policy")
    deploy: {machine: lab}
    path: dynamic
    inputs:
      obs_state: {source: mavis_runtime/obs_state, queue_size: 1, queue_policy: drop_oldest}
      session: mavis_runtime/session
      policy_reset: mavis_runtime/policy_reset
      events: {source: mavis_runtime/events, queue_size: 64}
      cam_cam_front: {source: mavis_runtime/cam_cam_front, queue_size: 1, queue_policy: drop_oldest}
      cam_cam_top: {source: mavis_runtime/cam_cam_top, queue_size: 1, queue_policy: drop_oldest}
      cam_view_wrist_cam: {source: mavis_runtime/cam_view_wrist_cam, queue_size: 1, queue_policy: drop_oldest}
      cam_grip_wrist_cam: {source: mavis_runtime/cam_grip_wrist_cam, queue_size: 1, queue_policy: drop_oldest}
      cam_grip_wrist: {source: mavis_runtime/cam_grip_wrist, queue_size: 1, queue_policy: drop_oldest}
      cam_view_wrist: {source: mavis_runtime/cam_view_wrist, queue_size: 1, queue_policy: drop_oldest}
    outputs: [action, spec, status, trainer_status]
  - id: viewer  # placeholder: fixed-viewpoint consumer; inputs only, no outputs
    deploy: {machine: lab}
    path: dynamic
    inputs:
      arm_state: {source: mavis_runtime/arm_state, queue_size: 1, queue_policy: drop_oldest}
      session: mavis_runtime/session
      cam_cam_front: {source: mavis_runtime/cam_cam_front, queue_size: 1, queue_policy: drop_oldest}
      cam_cam_top: {source: mavis_runtime/cam_cam_top, queue_size: 1, queue_policy: drop_oldest}
      cam_view_wrist_cam: {source: mavis_runtime/cam_view_wrist_cam, queue_size: 1, queue_policy: drop_oldest}
      cam_view_wrist_cam_depth: {source: mavis_runtime/cam_view_wrist_cam_depth, queue_size: 1, queue_policy: drop_oldest}
      cam_grip_wrist_cam: {source: mavis_runtime/cam_grip_wrist_cam, queue_size: 1, queue_policy: drop_oldest}
      cam_grip_wrist: {source: mavis_runtime/cam_grip_wrist, queue_size: 1, queue_policy: drop_oldest}
      cam_view_wrist: {source: mavis_runtime/cam_view_wrist, queue_size: 1, queue_policy: drop_oldest}
  - id: observer  # placeholder: loggers / rerun bridges
    deploy: {machine: lab}
    path: dynamic
    inputs:
      heartbeat: {source: mavis_runtime/heartbeat, queue_size: 8}
      session: {source: mavis_runtime/session, queue_size: 8}
      telemetry: {source: mavis_runtime/telemetry, queue_size: 8}
      events: {source: mavis_runtime/events, queue_size: 64}
      arm_state: {source: mavis_runtime/arm_state, queue_size: 1, queue_policy: drop_oldest}
      arm_cmd: {source: mavis_runtime/arm_cmd, queue_size: 1, queue_policy: drop_oldest}
      obs_state: {source: mavis_runtime/obs_state, queue_size: 1, queue_policy: drop_oldest}
      policy_reset: {source: mavis_runtime/policy_reset, queue_size: 8}
      cam_cam_front: {source: mavis_runtime/cam_cam_front, queue_size: 1, queue_policy: drop_oldest}
      cam_cam_top: {source: mavis_runtime/cam_cam_top, queue_size: 1, queue_policy: drop_oldest}
      cam_view_wrist_cam: {source: mavis_runtime/cam_view_wrist_cam, queue_size: 1, queue_policy: drop_oldest}
      cam_view_wrist_cam_depth: {source: mavis_runtime/cam_view_wrist_cam_depth, queue_size: 1, queue_policy: drop_oldest}
      cam_grip_wrist_cam: {source: mavis_runtime/cam_grip_wrist_cam, queue_size: 1, queue_policy: drop_oldest}
      cam_grip_wrist: {source: mavis_runtime/cam_grip_wrist, queue_size: 1, queue_policy: drop_oldest}
      cam_view_wrist: {source: mavis_runtime/cam_view_wrist, queue_size: 1, queue_policy: drop_oldest}
      mic_mic_view: {source: mavis_runtime/mic_mic_view, queue_size: 32}
  - id: canary  # lab-side start-barrier canary: the bridge attaches it in a SUBPROCESS after a restart with remote placeholders and only attaches mavis_runtime once it returned (a blocked Node() holds the GIL; 14-dora §16.1)
    deploy: {machine: lab}
    path: dynamic
    inputs:
      heartbeat: {source: probe/heartbeat, queue_size: 1, queue_policy: drop_oldest}
  - id: probe  # the ONLY spawned node: keeps the dataflow Running + liveness canary
    deploy: {machine: lab}
    path: python3
    args: -m apollo_mavis_v2_runtime.dora_bridge.nodes.probe
    env: {RUST_LOG: error}
    inputs:
      tick: dora/timer/hz/1
    outputs: [heartbeat]
